# PostgreSQL remoto. Define las variables de entorno antes de ejecutar la aplicación.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://[URL_AWS]:5432/banking_db}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://[URL_AWS]:5432/banking_db}
quarkus.hibernate-orm.jdbc.enabled=false
quarkus.rest-client.exchange-api.url=https://api.frankfurter.dev
quarkus.datasource.db-version=12.16
quarkus.datasource.reactive.postgresql.ssl-mode=require
quarkus.datasource.reactive.trust-all=true

#quarkus.flyway.migrate-at-start=true

%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.roles.role-claim-path=cognito:groups
