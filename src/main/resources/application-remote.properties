quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=12.16
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
#quarkus.datasource.jdbc.url=${DB_URL: jdbc:postgresql://database-1.ce10ui6eaxio.us-east-1.rds.amazonaws.com:5432/banking_db}
#quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:5432/banking_db}
quarkus.datasource.reactive.url=postgresql://[URL AWS]:5432/banking_db
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://[URL AWS]:5432/banking_db}
quarkus.hibernate-orm.jdbc.enabled=false
quarkus.rest-client.exchange-api.url=https://api.frankfurter.dev
quarkus.datasource.reactive.postgresql.ssl-mode=require
quarkus.datasource.reactive.trust-all=true

# quarkus.flyway.migrate-at-start=true
# quarkus.hibernate-orm.schema-management.strategy=validate

#quarkus.flyway.migrate-at-start=true

%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
