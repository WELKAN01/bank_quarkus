# PostgreSQL local. Las variables de entorno permiten cambiar credenciales sin editar este archivo.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:5432/banking_db}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/banking_db}
quarkus.hibernate-orm.jdbc.enabled=false
quarkus.rest-client.exchange-api.url=https://api.frankfurter.dev

# quarkus.flyway.migrate-at-start=true

%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
